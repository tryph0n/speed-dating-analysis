[project]
name = "speed-dating-analysis"
version = "0.1.0"
description = "Descriptive analysis of the Columbia speed dating experiments"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "ipykernel>=7.1.0",
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/tryph0n/tinder"
Repository = "https://github.com/tryph0n/tinder"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = []

[dependency-groups]
dev = [
    "ruff==0.15.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
